name: Validate daily practice

on:
  push:
    paths:
      - "practice/**"
      - "scripts/check_reference.py"
      - "scripts/run_problem.py"
      - ".github/workflows/daily-practice.yml"
  pull_request:
    paths:
      - "practice/**"
      - "scripts/check_reference.py"
      - "scripts/run_problem.py"
      - ".github/workflows/daily-practice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate all generated reference solutions
        shell: bash
        run: |
          shopt -s nullglob
          DAYS=(practice/????-??-??-*)
          if (( ${#DAYS[@]} == 0 )); then
            echo "No generated practice days yet."
            exit 0
          fi

          for day in "${DAYS[@]}"; do
            echo "Validating $day"
            python scripts/check_reference.py "$day"
          done
